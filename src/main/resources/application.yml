spring:
  application:
    name: ecommerce-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/ecommerce}
    username: ${DB_USERNAME:ecommerce}
    password: ${DB_PASSWORD:ecommerce}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
  cache:
    type: redis
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 5000
      "[mail.smtp.writetimeout]": 5000

server:
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: when-authorized
      roles: ADMIN
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState, db, redis
  health:
    # Order emails are sent asynchronously after commit; a mail server outage must not take the
    # application out of the load balancer.
    mail:
      enabled: false
  info:
    git:
      mode: simple
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  pattern:
    correlation: "[%X{correlationId:-}] "

app:
  security:
    jwt:
      secret: ${JWT_SECRET:}
      issuer: ecommerce-backend
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
      refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:7d}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  rate-limit:
    login:
      attempts: 5
      window: 1m
  async:
    core-size: ${ASYNC_CORE_SIZE:2}
    max-size: ${ASYNC_MAX_SIZE:4}
    queue-capacity: ${ASYNC_QUEUE_CAPACITY:100}
    thread-name-prefix: async-
    rejection-policy: ${ASYNC_REJECTION_POLICY:CALLER_RUNS}
    shutdown-timeout: 30s
  notifications:
    from: ${MAIL_FROM:orders@ecommerce.local}
  payments:
    gateway: ${PAYMENT_GATEWAY:simulated}
  orders:
    idempotency-key-retention: ${ORDER_IDEMPOTENCY_KEY_RETENTION:24h}
    idempotency-cleanup-cron: ${ORDER_IDEMPOTENCY_CLEANUP_CRON:0 15 * * * *}
  observability:
    slow-method-threshold: ${SLOW_METHOD_THRESHOLD:500ms}
  cache:
    ttl:
      products: ${CACHE_TTL_PRODUCTS:10m}
      categories: ${CACHE_TTL_CATEGORIES:1h}
